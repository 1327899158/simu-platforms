<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>仿真通 · 全页面高保真UI</title>
<style>
:root{
  --primary:#33469C;--primary-dark:#232F73;--primary-light:#EEF0FA;
  --accent:#B5762A;--accent-light:#FBF1E4;
  --success:#0E8F58;--success-light:#E5F5EE;
  --warning:#B5762A;--warning-light:#FBF1E4;
  --danger:#C13B34;--danger-light:#FBEDEC;
  --text-1:#171B2E;--text-2:#4A5068;--text-3:#8A90A6;
  --bg:#F4F5F9;--card:#FFFFFF;--border:#E4E6EF;
  --radius:12px;--radius-sm:8px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 4px 16px rgba(16,24,40,.07);
  --shadow-lg:0 12px 28px rgba(16,24,40,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
@keyframes marquee-scroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.marquee-wrap{overflow:hidden;position:relative;}
.marquee-wrap::before,.marquee-wrap::after{content:'';position:absolute;top:0;bottom:0;width:24px;z-index:2;pointer-events:none;}
.marquee-track{display:flex;width:max-content;animation:marquee-scroll 16s linear infinite;}
@keyframes float-y{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes pulse-ring{0%{transform:scale(.9);opacity:.7;}70%{transform:scale(1.35);opacity:0;}100%{transform:scale(1.35);opacity:0;}}
@keyframes spin-slow{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
@keyframes spin-slow-rev{0%{transform:rotate(360deg);}100%{transform:rotate(0deg);}}
@keyframes glow-shift{0%,100%{opacity:.5;}50%{opacity:1;}}
@keyframes card-float{0%,100%{transform:translateY(0) rotate(var(--r,0deg));}50%{transform:translateY(-6px) rotate(var(--r,0deg));}}
@keyframes shimmer-sweep{0%{transform:translateX(-120%);}100%{transform:translateX(220%);}}
@keyframes sparkle-pop{0%,100%{opacity:.2;transform:scale(.6);}50%{opacity:1;transform:scale(1);}}
.hero-orbit-ring{position:absolute;border:1.5px solid rgba(255,255,255,.35);border-radius:50%;}
.hero-float-chip{position:absolute;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:14px;backdrop-filter:blur(6px);display:flex;align-items:center;gap:5px;padding:6px 10px;box-shadow:0 8px 20px rgba(0,0,0,.18);animation:card-float 3.6s ease-in-out infinite;}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#DCE1EA;color:var(--text-1);}
.topbar{position:sticky;top:0;z-index:999;background:#111827;padding:14px 20px;display:flex;gap:8px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.2);}
.topbar button{background:#1F2937;color:#D1D5DB;border:1px solid #374151;padding:7px 14px;border-radius:20px;font-size:12.5px;cursor:pointer;transition:.2s;white-space:nowrap;}
.topbar button:hover{background:#374151;color:#fff;}
.topbar button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.stage{padding:36px 0;display:flex;justify-content:center;}
.phone{width:390px;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.35),0 0 0 12px #0B0D12,0 0 0 14px #2A2D34;position:relative;}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:28px;background:#0B0D12;border-radius:0 0 18px 18px;z-index:50;}
.screen{height:844px;overflow-y:auto;position:relative;display:flex;flex-direction:column;}
.screen::-webkit-scrollbar{width:0;}
.statusbar{height:47px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 8px;font-size:13px;font-weight:600;color:#fff;}
.page-hidden{display:none;}

/* ---- 通用组件 ---- */
.navbar{padding:14px 20px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.navbar-title{font-size:17px;font-weight:700;}
.navbar>span:first-child{font-size:24px;font-weight:400;line-height:1;padding:2px 10px 2px 0;margin-left:-6px;cursor:pointer;display:inline-flex;align-items:center;min-width:28px;}
.icon-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:15px;}
.section{padding:16px 18px;}
.section-title{font-size:15px;font-weight:700;color:var(--text-1);display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-title .more{font-size:12px;color:var(--text-3);font-weight:400;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;}
.tag-hot{background:linear-gradient(135deg,#FFEDD5,#FFE0C2);color:#C2410C;}
.tag-hot::before{content:'🔥';font-size:10px;}
.tag-new{background:var(--success-light);color:var(--success);}
.tag-primary{background:var(--primary-light);color:var(--primary);}
.tag-warn{background:var(--warning-light);color:#B54708;}
.tag-gray{background:#F2F4F7;color:var(--text-2);}
.avatar{border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#6B7FD9,#33469C);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0;}
.btn{border:none;border-radius:24px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.2s;}
.btn-primary{background:linear-gradient(135deg,var(--primary),#5B4FCF);color:#fff;box-shadow:0 6px 16px rgba(51,70,156,.35);}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
.btn-ghost{background:var(--primary-light);color:var(--primary);}
.btn-accent{background:linear-gradient(135deg,var(--accent),#FF9466);color:#fff;box-shadow:0 6px 16px rgba(255,122,69,.35);}
.divider{height:8px;background:var(--bg);}
.bottom-nav{position:sticky;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;padding:8px 4px 26px;box-shadow:0 -4px 20px rgba(0,0,0,.04);z-index:30;margin-top:auto;flex-shrink:0;}
.logo-mark{width:100%;height:100%;border-radius:inherit;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'PingFang SC','Helvetica Neue',sans-serif;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--text-3);font-weight:600;}
.nav-item.active{color:var(--primary);}
.nav-icon{font-size:20px;}
.nav-fab{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#5B4FCF);display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;margin-top:-24px;box-shadow:0 8px 20px rgba(51,70,156,.5);border:4px solid #fff;}
.progress-track{height:6px;background:#E4E7EC;border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#5B4FCF);border-radius:6px;}
.input-box{background:#F9FAFB;border:1px solid var(--border);border-radius:12px;padding:13px 14px;font-size:14px;color:var(--text-1);display:flex;align-items:center;gap:8px;}
.input-box input{border:none;background:transparent;outline:none;font-size:14px;flex:1;min-width:0;width:100%;color:#101828!important;-webkit-text-fill-color:#101828;opacity:1;}
input-box input[type=number]{-moz-appearance:textfield;}
.input-box input[type=number]::-webkit-outer-spin-button,.input-box input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.input-box input::placeholder{color:#98A2B3;-webkit-text-fill-color:#98A2B3;}
.competition-bar{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#FFF7ED,#FFEEDD);border:1px solid #FED7AA;border-radius:10px;padding:8px 10px;font-size:11.5px;color:#9A3412;font-weight:600;}
.stat-box{flex:1;text-align:center;padding:14px 6px;}
.stat-num{font-size:20px;font-weight:800;color:var(--text-1);}
.stat-label{font-size:11px;color:var(--text-3);margin-top:2px;}
.chip{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;background:#F2F4F7;color:var(--text-2);white-space:nowrap;}
.chip.active{background:var(--text-1);color:#fff;}
.filter-row{display:flex;gap:5px;width:100%;}
.filter-row .chip{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 3px;font-size:10.5px;}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;}
.hscroll::-webkit-scrollbar{display:none;}
.badge-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);position:absolute;top:-2px;right:-2px;border:2px solid #fff;}
.label-title{font-size:12px;color:var(--text-3);font-weight:600;margin-bottom:6px;display:block;}
</style>
</head>
<body>

<div class="topbar" id="tabs"></div>
<div class="stage">
<div class="phone">
  <div class="notch"></div>

</div>

<script>
const CATEGORY_DATA = [

  {name:'材料仿真',items:[['🧱','复合材料仿真','245人需要'],['🧪','材料本构建模','118人需要'],['🔬','微观结构仿真','94人需要'],['🧵','纤维增强材料','76人需要'],['⚗️','高分子材料仿真','69人需要'],['🪨','材料失效分析','103人需要'],['✨','其他材料仿真需求','18人需要']]},
  {name:'多体动力学',items:[['⚙️','多体动力学仿真','131人需要'],['🚙','车辆动力学分析','156人需要'],['🦾','机构运动仿真','98人需要'],['🛞','悬架系统仿真','87人需要'],['🤖','机器人运动学','72人需要'],['🎯','轨迹优化仿真','58人需要'],['✨','其他多体动力学需求','15人需要']]},

  {name:'其他',items:[['🧬','生物力学仿真','29人需要'],['⛏️','岩土工程仿真','24人需要'],['🌫️','燃烧/化学反应仿真','22人需要'],['🛰️','航空航天专项仿真','18人需要'],['🏗️','建筑结构仿真','16人需要'],['✨','其他自定义需求，可与工程师沟通','35人需要']]}
];
let ROLE_DATA=[
  {icon:'👑',name:'超级管理员',scope:'全部权限：管理账号/财务放款/配置修改/日志审计',count:1,color:'#B54708'},
  {icon:'🥇',name:'金牌/资质审核员',scope:'工程师资质审核、案例审核',count:4,color:'var(--primary)'},
  {icon:'⚖️',name:'仲裁员',scope:'纠纷仲裁、退款审批、举报处理',count:3,color:'#6C4CFF'},
  {icon:'💰',name:'财务',scope:'提现放款、开票对账，无仲裁/审核权限',count:2,color:'#12B76A'}
];
let roleEditIdx=-1;
function renderAdminRoles(){
  const idx=pages.findIndex(p=>p.id==='admin-roles');
  currentIdx=idx;
  container.style.background=pages[idx].bg;
  container.innerHTML=`
  <div class="statusbar"><span>9:41</span><span>●●●● 5G 🔋</span></div>
  <div class="navbar" style="border-bottom:1px solid var(--border);"><span onclick="go('admin-home')">‹</span><span style="font-size:15px;font-weight:700;">权限分级</span><span onclick="go('admin-account-create')" style="font-size:12px;color:var(--primary);font-weight:700;cursor:pointer;">+ 新建账号</span></div>
  <div class="section">
    ${ROLE_DATA.map((e,i)=>`
    <div class="card" style="padding:16px;margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:18px;">${e.icon}</span><span style="font-size:13.5px;font-weight:700;color:${e.color};">${e.name}</span></div>
        <span style="font-size:12px;color:var(--text-3);">${e.count}人</span>
      </div>
      <div style="font-size:11px;color:var(--text-3);margin-top:8px;line-height:1.6;">权限范围：${e.scope}</div>

        <span onclick="openRoleEdit(${i})" style="font-size:11.5px;color:var(--primary);font-weight:600;cursor:pointer;">✏️ 编辑角色</span>

  <div class="section">
    <div class="card" style="padding:14px;background:var(--warning-light);border:none;display:flex;gap:10px;">
      <span style="font-size:16px;">⚠️</span>
      <div style="font-size:11.5px;color:#B54708;line-height:1.6;">登录后底部导航及可见模块将根据角色自动过滤，例如财务角色不会看到“确认判定”按钮</div>

function openNewTicketModal(){
  const overlay=document.createElement('div');
  overlay.id='newTicketModalOverlay';
  overlay.style.cssText='position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(16,24,40,.5);display:flex;align-items:flex-end;z-index:999;';

    '<div style="font-size:11px;color:var(--text-3);margin-top:4px;">提交后客服将在'+RULES_CFG.timeoutChat+'小时内响应，紧急问题建议直接使用上方"立即咨询"</div>'+
    '<div class="section-title" style="margin-top:16px;">问题类型</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:8px;" id="newTicketTypeRow">'+['账号异常','订单/交易','纠纷售后','发票问题','其他'].map(function(t,i){return '<span class="chip'+(i===0?' active':'')+'" onclick="[...this.parentElement.children].forEach(function(c){c.classList.remove(\'active\')});this.classList.add(\'active\')" style="cursor:pointer;">'+t+'</span>';}).join('')+'</div>'+
    '<div class="section-title" style="margin-top:14px;">问题描述</div>'+
    '<div class="card" style="padding:12px;"><textarea id="newTicketDesc" placeholder="请详细描述您遇到的问题，以便客服快速核实处理..." style="border:none;width:100%;height:80px;font-size:13px;outline:none;resize:none;"></textarea></div>'+
    '<button class="btn btn-primary" onclick="submitNewTicket()" style="width:100%;height:46px;font-size:14.5px;margin-top:16px;">提交工单</button>'+
  '</div>';
  document.querySelector('.phone').appendChild(overlay);
}
function closeNewTicketModal(){
  const overlay=document.getElementById('newTicketModalOverlay');
  if(overlay)overlay.remove();
}
let userTickets=[];
function submitNewTicket(){
  const desc=document.getElementById('newTicketDesc');
  if(desc && !desc.value.trim()){showToast('请填写问题描述');return;}
  const typeRow=document.getElementById('newTicketTypeRow');
  const typeChip=typeRow?typeRow.querySelector('.chip.active'):null;
  const typeName=typeChip?typeChip.textContent:'其他';
  const descText=desc?desc.value.trim():'';
  const title=typeName+(descText.length>0?' · '+(descText.length>12?descText.slice(0,12)+'...':descText):'');
  userTickets.unshift([title,'处理中','今天提交','warn']);
  closeNewTicketModal();
  showToast('工单已提交，客服将在'+RULES_CFG.timeoutChat+'小时内响应');
  setTimeout(function(){renderCsTicket();},500);
}

    </div>
    <div style="margin-top:14px;">
      <span class="label-title">当前人数（仅展示，实际以账号列表为准）</span>
      <div class="input-box"><input id="roleCountInput" type="number" value="${role.count}"></div>
    </div>

function withdrawBalance(){return 4280;}
function calcWithdraw(){
  const inp=document.getElementById('withdrawAmountInput');
  const feeEl=document.getElementById('withdrawFeeVal');
  const arrEl=document.getElementById('withdrawArriveVal');
  if(!inp||!feeEl||!arrEl)return;
  const pct=VAS_PRICES.withdrawFee||0.006;
  const bal=withdrawBalance();
  const v=parseFloat(inp.value);
  if(!v||isNaN(v)||v<=0){feeEl.textContent='¥0.00';arrEl.textContent='¥0.00';arrEl.style.color='var(--primary)';return;}
  if(v>bal){feeEl.textContent='¥0.00';arrEl.textContent='超过可提现余额';arrEl.style.color='var(--danger)';return;}
  arrEl.style.color='var(--primary)';
  feeEl.textContent='¥'+(v*pct).toFixed(2);
  arrEl.textContent='¥'+(v*(1-pct)).toFixed(2);
}
function fillAllWithdraw(el){
  const box=el.closest('.input-box');
  let inp=box?box.querySelector('input'):null;
  if(!inp)inp=document.getElementById('withdrawAmountInput');

  showToast('已填入全部可提现余额 ¥'+withdrawBalance().toLocaleString()+'.00');

function submitWithdraw(){
  const inp=document.getElementById('withdrawAmountInput');

  showToast('提现申请已提交：¥'+v.toLocaleString()+(v>5000?'，已进入人工风控复核（一般1个工作日内到账）':'，¥5,000以内由系统24小时内自动到账'));
  setTimeout(()=>go('withdraw-history'),700);
}

function genDefaultNick(surname,gender){

  if(!NICK_REGISTRY.has(nick)){NICK_REGISTRY.add(nick);}

function applyAvatarGlobally(){
  var eng=window.profileEng||{}, cust=window.profileCust||{};
  var srcMap={'林':eng.avatar||'','李':cust.avatar||''};
  var els=document.querySelectorAll('[class*="avatar"]');
  for(var i=0;i<els.length;i++){
    var el=els[i];
    if(el.children.length>0) continue;
    var t=(el.textContent||'').trim();
    var src=srcMap[t];
    if(src && src.indexOf('data:')===0){
      el.innerHTML='<img src="'+src+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block" alt="">';
    }
  }
}
function startAvatarWatcher(){
  if(window._avatarWatcher) return;
  window._avatarWatcher=new MutationObserver(function(){ applyAvatarGlobally(); });
  window._avatarWatcher.observe(document.body,{childList:true,subtree:true});
  applyAvatarGlobally();
}
if(document.body){ startAvatarWatcher(); }
else if(document.addEventListener){ document.addEventListener('DOMContentLoaded', startAvatarWatcher); }

function applyAvatarToEl(el,avatar){
  if(!el)return;
  const isImg=typeof avatar==='string'&&avatar.indexOf('data:image')===0;
  if(isImg){
    if(el.tagName!=='IMG'){
      const img=document.createElement('img');
      for(let k=0;k<el.attributes.length;k++){
        const at=el.attributes[k];
        if(at.name==='class'||at.name==='style'||at.name==='src')continue;
        img.setAttribute(at.name,at.value);
      }
      img.className=el.className;
      img.style.cssText=el.style.cssText;
      img.style.display='block';
      img.src=avatar;
      img.alt='';
      el.parentNode.replaceChild(img,el);
    }else if(el.src!==avatar){el.src=avatar;}
  }else{
    const txt=(avatar===undefined||avatar===null)?'':String(avatar);
    if(el.tagName==='IMG'){
      const d=document.createElement('div');
      for(let k=0;k<el.attributes.length;k++){
        const at=el.attributes[k];
        if(at.name==='class'||at.name==='style'||at.name==='src')continue;
        d.setAttribute(at.name,at.value);
      }
      d.className=el.className;
      d.style.cssText=el.style.cssText;
      d.textContent=txt;
      el.parentNode.replaceChild(d,el);
    }else if(el.textContent!==txt){el.textContent=txt;}
  }
}

function uploadProfileAvatar(input){
  const file=input&&input.files&&input.files[0];
  if(!file)return;
  if(file.size>5*1024*1024){showToast('图片不能超过5MB');input.value='';return;}
  const reader=new FileReader();
  reader.onload=function(ev){
    profileAvatar=ev.target.result;
    const prev=document.getElementById('profileAvatarPreview');
    if(prev)applyAvatarToEl(prev,profileAvatar);
    showToast('已从相册设置头像，保存后全站生效');
  };
  reader.readAsDataURL(file);
  input.value='';
}

  const nick=(inp?inp.value.trim():'');
  if(!nick){showToast('请输入昵称');return;}
  if(nick.length<2||nick.length>12){showToast('昵称长度需为2-12个字符');return;}

    }
  }

  const feePct=((VAS_PRICES.guaranteeFee*100).toFixed(1)).replace(/\.0$/,'');

  const total=Math.round((base+fee-coinDeduct-couponDeduct)*100)/100;

function sortHall(mode,el){

    const active=c===el;
    c.style.background=active?'var(--primary)':'';
    c.style.color=active?'#fff':'var(--text-2)';
  });
  const wrap=document.getElementById('hallNeedList');
  if(wrap){
    const items=[...wrap.querySelectorAll('.hall-need-item')];
    const map={
      'default':(a,b)=>{
        let sa=0,sb=0;
        if(hallStrategy.urgent){sa+=parseInt(a.dataset.urgent||0)*100;sb+=parseInt(b.dataset.urgent||0)*100;}
        if(hallStrategy.value){sa+=(parseInt(a.dataset.price||0)>=5000?10:0);sb+=(parseInt(b.dataset.price||0)>=5000?10:0);}
        if(hallStrategy.hot){sa+=parseInt(a.dataset.views||0)/10;sb+=parseInt(b.dataset.views||0)/10;}
        return sb-sa;
      },
      'hot':(a,b)=>parseInt(b.dataset.views||0)-parseInt(a.dataset.views||0),
      'price':(a,b)=>parseInt(b.dataset.price||0)-parseInt(a.dataset.price||0),
      'new':(a,b)=>(b.dataset.date||'').localeCompare(a.dataset.date||''),
      'urgent':(a,b)=>parseInt(b.dataset.urgent||0)-parseInt(a.dataset.urgent||0)
    };
    items.sort(map[mode]);
    items.forEach(it=>wrap.appendChild(it));
  }
  showToast(mode==='default'?'已按综合排序':mode==='hot'?'已按热度排序：浏览量高的需求优先展示':mode==='price'?'已按预算从高到低排序，高价值单优先':mode==='new'?'已按最新发布排序':mode==='urgent'?'已按加急优先排序：加急需求置顶展示':'');
}

function renderInviteQr(){
  const box=document.getElementById('inviteQrBox');
  if(!box)return;
  const code=inviteCodeLabel();
  let seed=0;
  for(let i=0;i<code.length;i++){seed=(seed*31+code.charCodeAt(i))>>>0;}
  function rnd(){seed=(seed*1103515245+12345)>>>0;return seed/4294967296;}
  const N=21;
  const g=[];
  for(let y=0;y<N;y++){g.push([]);for(let x=0;x<N;x++)g[y].push(false);}
  function finder(ox,oy){
    for(let dy=0;dy<7;dy++)for(let dx=0;dx<7;dx++){
      const on=(dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4));
      g[oy+dy][ox+dx]=on;
    }
  }
  finder(0,0);finder(N-7,0);finder(0,N-7);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const inFinder=(x<7&&y<7)||(x>=N-7&&y<7)||(x<7&&y>=N-7);
    if(inFinder)continue;
    if(rnd()>0.48)g[y][x]=true;
  }
  let rects='';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(g[y][x])rects+='<rect x="'+(x*4+2)+'" y="'+(y*4+2)+'" width="4" height="4" fill="#111827" shape-rendering="crispEdges"/>';
  box.innerHTML='<svg viewBox="0 0 88 88" style="width:112px;height:112px;display:block;background:#fff;border-radius:8px;">'+rects+'</svg>';
}

function submitEngineerExtension(){

  const dayChip=document.querySelector('.eng-extend-day-chip.active');

function toggleEngChatSearch(){
  const bar=document.getElementById('engChatSearchBar');
  if(!bar)return;
  const show=bar.style.display==='none'||bar.style.display==='';
  bar.style.display=show?'block':'none';
  if(show){const inp=document.getElementById('engChatSearchInput');if(inp){inp.value='';inp.focus();}filterEngChatList();}
  else{filterEngChatList();}
}
function filterEngChatList(){
  const inp=document.getElementById('engChatSearchInput');
  const kw=(inp&&inp.value||'').trim();
  const items=document.querySelectorAll('.eng-chat-item');
  let visibleCount=0;
  items.forEach(el=>{
    const match=!kw||el.dataset.name.includes(kw)||el.dataset.topic.includes(kw);
    el.style.display=match?'':'none';
    if(match)visibleCount++;
  });
  const emptyTip=document.getElementById('engChatEmptyTip');
  if(emptyTip)emptyTip.style.display=(kw&&visibleCount===0)?'block':'none';
}
function deleteEngChatItem(el){
  event.stopPropagation();

  if(!item)return;

    item.style.display='none';

  }
}

{id:'quote-submit',name:'8b.填写报价',bg:'#fff',html:`

<div class="navbar" style="border-bottom:1px solid var(--border);"><span onclick="go('hall-need-detail')">‹</span><span style="font-size:15px;font-weight:700;">填写报价</span><span></span></div>
<div class="section">
  <div class="card" style="padding:14px;display:flex;gap:12px;align-items:center;">
    <div style="width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#93A5FF,#4F6BFF);flex-shrink:0;"></div>
    <div style="flex:1;"><div style="font-size:13.5px;font-weight:700;">无人机机架结构强度分析</div><div style="font-size:10.5px;color:var(--text-3);margin-top:2px;">李先生 · 预算¥5000-8000 · 期望5个工作日内</div></div>
  </div>

  <div class="section-title" style="margin-top:18px;">报价金额</div>
  <div class="input-box"><span style="font-size:18px;font-weight:700;">¥</span><input placeholder="请输入报价金额" style="font-size:18px;font-weight:700;"></div>
  <div style="font-size:10.5px;color:var(--text-3);margin-top:6px;">客户预算范围 ¥5000-8000，供参考</div>

  <div class="section-title" style="margin-top:18px;">预计交付周期</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    ${[['1-2天',false],['3天',true],['5天',false],['✏️ 自定义',false]].map(e=>`
    <div class="card" onclick="selectQuoteDeliver(this)" style="padding:12px;text-align:center;cursor:pointer;${e[1]?'border:2px solid var(--primary);background:var(--primary-light);':''}">
      <div style="font-size:13px;font-weight:700;color:${e[1]?'var(--primary)':'var(--text-1)'};">${e[0]}</div>
    </div>`).join('')}
  </div>
  <div id="quoteDeliverCustomBox" style="display:none;margin-top:10px;">
    <div class="input-box">
      <span style="font-size:15px;">📅</span>
      <input id="quoteDeliverCustomInput" type="number" min="1" max="60" placeholder="请输入自定义交付天数（1-60）" style="font-weight:700;">
      <span style="font-size:11px;color:var(--text-3);">天</span>
    </div>
  </div>

  <div class="section-title" style="margin-top:18px;">免费修改次数</div>
  <div style="font-size:11px;color:var(--text-3);margin-top:-8px;margin-bottom:10px;">超出免费次数后的修改可与客户另行协商，建议结合项目复杂度合理设置</div>
  <div style="display:flex;gap:10px;">
    ${[['1次',false],['2次',true],['3次',false],['✏️ 自定义',false]].map(e=>`<span class="chip ${e[1]?'active':''}" onclick="selectQuoteRevise(this)" style="flex:1;text-align:center;cursor:pointer;">${e[0]}</span>`).join('')}
  </div>
  <div id="quoteReviseCustomBox" style="display:none;margin-top:10px;">
    <div class="input-box">
      <span style="font-size:15px;">🔧</span>
      <input id="quoteReviseCustomInput" type="number" min="1" max="20" placeholder="请输入自定义修改次数（1-20）" style="font-weight:700;">
      <span style="font-size:11px;color:var(--text-3);">次</span>
    </div>
  </div>

  <div class="card" id="urgencyNegotiateCard" onclick="openUrgencyNegotiate(this)" style="padding:14px;margin-top:18px;display:flex;align-items:center;gap:12px;cursor:pointer;border:1.5px solid var(--border);">
    <div style="font-size:20px;">⚡</div>
    <div style="flex:1;">
      <div style="font-size:12.5px;font-weight:700;">加急交付，协商加价 <span style="color:var(--accent);">+10%~20%</span></div>
      <div style="font-size:10.5px;color:var(--text-3);margin-top:3px;line-height:1.6;">缩短交付周期，向客户发起加急加价协商；客户确认后按加急价成交，拒绝则按原报价成交</div>
    </div>
    <div id="urgencyNegotiateStatus" style="font-size:11px;color:var(--primary);font-weight:700;flex-shrink:0;">发起协商 ›</div>
  </div>

  <div class="section-title" style="margin-top:18px;">报价说明</div>
  <div class="card" style="padding:14px;">
    <textarea placeholder="说明您的方案思路、类似项目经验、交付物内容等，让客户更愿意选择您..." style="border:none;width:100%;height:100px;font-size:13px;outline:none;resize:none;color:var(--text-1);">已完成同类无人机机架分析12次，可提供详细应力云图报告，含完整有限元分析流程与优化建议。</textarea>
  </div>

  <div class="card" style="padding:14px;margin-top:18px;background:var(--primary-light);border:none;display:flex;gap:10px;">
    <span style="font-size:16px;">💡</span>
    <div style="font-size:11.5px;color:var(--primary);line-height:1.6;">提交后客户可在报价列表中看到您的方案，您也可随时在"我的报价"中撤回或修改，报价前也可先与客户沟通细节以提高中标率</div>
  </div>
  <div style="height:80px;"></div>
</div>
<div style="position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);padding:12px 16px 24px;display:flex;gap:10px;">
  <button class="btn btn-outline" onclick="goChat('engineer')" style="flex:1;height:48px;font-size:14.5px;">💬 先沟通</button>
  <button class="btn btn-primary" onclick="submitMyQuote()" style="flex:2;height:48px;font-size:15px;">✓ 提交报价</button>
</div>
`},

{id:'quote-track',name:'9.我的报价跟踪',bg:'#fff',html:`
<div class="statusbar"><span>9:41</span><span>●●●● 5G 🔋</span></div>
<div class="navbar" style="border-bottom:1px solid var(--border);"><span>‹</span><span style="font-size:15px;font-weight:700;">我的报价</span><span></span></div>
<div class="section">
  <div class="card" style="display:flex;padding:4px 0;">
    ${[['24','已报价',0],['8','进入沟通',1],['5','已成交',3],['21%','转化率',0]].map(e=>`<div class="stat-box" onclick="filterQuoteTrack(${e[2]})" style="cursor:pointer;">
      <div class="stat-num">${e[0]}</div><div class="stat-label">${e[1]}</div></div>`).join('')}
  </div>
</div>
<div class="section" style="padding-top:0;">
  <div class="filter-row" id="quoteTrackFilterRow">${['全部','待回应','已读未回','已成交','未中标'].map((t,i)=>`<div class="chip ${i===0?'active':''}" onclick="filterQuoteTrack(${i})">${t}</div>`).join('')}</div>
</div>
<div class="section" style="padding-top:10px;">
${[
  ['无人机机架结构强度分析','¥3800','已成交 ✓','success','恭喜，客户已确认选择您 · 订单进行中','已成交','order-detail'],
  ['电动车电池托架碰撞仿真','¥2800','已成交 ✓','success','恭喜，客户已确认选择您 · 订单已完成','已成交','order-detail'],
  ['某泵阀流固耦合分析','¥1800','未中标','fail','客户选择了其他工程师的报价','未中标','quote-detail']
].map(e=>`
<div class="card quote-track-item" data-status="${e[5]}" onclick="go('${e[6]}')" style="padding:16px;margin-bottom:12px;cursor:pointer;">
  <div style="display:flex;justify-content:space-between;">
    <div style="font-size:13.5px;font-weight:700;flex:1;">${e[0]}</div>
    <span class="tag ${e[3]==='success'?'tag-primary':e[3]==='fail'?'tag-gray':'tag-warn'}">${e[2]}</span>
  </div>
  <div style="font-size:18px;font-weight:800;color:var(--accent);margin-top:8px;">${e[1]}</div>
  <div style="font-size:11.5px;color:var(--text-3);margin-top:6px;">${e[4]}</div>
  <div style="display:flex;gap:8px;margin-top:12px;">
    <button class="btn btn-outline" onclick="event.stopPropagation();go('${e[6]}')" style="flex:1;height:34px;font-size:12px;">${e[3]==='success'?'查看订单':'查看详情'}</button>
    ${e[3]==='info'?'<button class="btn btn-primary" onclick="event.stopPropagation();goChat(\'engineer\')" style="flex:1;height:34px;font-size:12px;">💬 继续沟通</button>':''}
  </div>
</div>`).join('')}
</div>
<div style="height:100px;"></div>
<div class="bottom-nav">
  ${[['🏠','大厅','eng-hall'],['📊','我的报价','quote-track'],['FAB','','case-edit'],['💬','消息','eng-chatlist'],['👤','我的','eng-center']].map((t,i)=>i===2?`<div class="nav-item" onclick="go('${t[2]}')" style="cursor:pointer;"><div class="nav-fab">⚡</div></div>`:`<div class="nav-item ${i===1?'active':''}" onclick="go('${t[2]}')" style="cursor:pointer;"><span class="nav-icon">${t[0]}</span><span>${t[1]}</span></div>`).join('')}
</div>
`},

{id:'quote-detail',name:'9b.报价详情(工程师)',bg:'#fff',html:`
<div class="statusbar"><span>9:41</span><span>●●●● 5G 🔋</span></div>
<div class="navbar" style="border-bottom:1px solid var(--border);"><span onclick="go('quote-track')">‹</span><span style="font-size:15px;font-weight:700;">报价详情</span><span onclick="showToast('更多操作（演示）')" style="cursor:pointer;font-size:16px;">⋯</span></div>
<div class="section">
  <div class="card" style="padding:16px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div style="font-size:15px;font-weight:800;flex:1;padding-right:8px;">无人机机架结构强度分析</div>
      <span class="tag tag-warn">客户已读</span>
    </div>
    <div style="font-size:11px;color:var(--text-3);margin-top:6px;line-height:1.6;">客户：李先生 · 预算 ¥5000-8000 · 期望5个工作日内 · 发布于06-12</div>
    <div style="font-size:11px;color:var(--text-3);margin-top:4px;">需求编号 N20240612001 · 需求类型 结构强度分析</div>
  </div>

  <div class="card" style="padding:14px;margin-top:12px;background:var(--primary-light);border:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:12px;font-weight:700;color:var(--primary);">📊 报价状态</span>
      <span class="tag tag-warn">待客户回应</span>
    </div>
    <div style="font-size:11px;color:var(--primary);margin-top:6px;line-height:1.6;">客户已于 2小时前 查看您的报价，尚未回复；该客户近2小时活跃，正在多家对比中，建议主动沟通争取。</div>
  </div>

  <div class="section-title" style="margin-top:18px;">我的报价</div>
  <div class="card" style="padding:16px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;">
      <div><span style="font-size:24px;font-weight:800;color:var(--accent);">¥3800</span><span style="font-size:11px;color:var(--text-3);margin-left:6px;">预计3天交付</span></div>
      <span class="tag tag-primary">含2次免费修改</span>
    </div>
    <div style="height:1px;background:var(--border);margin:12px 0;"></div>
    <div style="font-size:12px;color:var(--text-2);line-height:1.7;">报价说明：已完成同类无人机机架分析12次，可提供详细应力云图报告，含完整有限元分析流程与优化建议。</div>
    <div style="font-size:10.5px;color:var(--text-3);margin-top:8px;">提交时间：2024-06-12 15:40 · 报价编号 Q20240612003</div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px;">
      <span onclick="if(confirm('确定撤回该报价吗？撤回后客户将无法看到，且不可恢复')){showToast('报价已撤回');setTimeout(function(){go('quote-track')},600)}" style="font-size:11px;color:var(--danger);font-weight:600;cursor:pointer;">撤回报价</span>
    </div>
  </div>

  <div class="section-title" style="margin-top:18px;">客户动态</div>
  <div class="card" style="padding:14px;margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;"><span style="font-size:12.5px;font-weight:600;">客户查看了您的报价</span><span style="font-size:10.5px;color:var(--text-3);">2小时前</span></div>
  </div>
  <div class="card" style="padding:14px;margin-bottom:10px;background:var(--accent-light);border:1px solid #F0D9C4;">
    <div style="display:flex;align-items:flex-start;gap:10px;">
      <span style="font-size:16px;">💡</span>
      <div style="flex:1;">
        <div style="font-size:12.5px;font-weight:700;color:#9A3412;">该客户近2小时活跃，正在多家对比中</div>
        <div style="font-size:10.5px;color:#9A3412;margin-top:4px;line-height:1.6;">尽快回复可提高胜率，建议主动沟通争取</div>
      </div>
    </div>
  </div>
  <div class="card" style="padding:14px;background:var(--primary-light);border:none;display:flex;gap:10px;">
    <span style="font-size:16px;">💡</span>
    <div style="font-size:11.5px;color:var(--primary);line-height:1.6;">报价未被客户确认前可随时修改或撤回；已被客户确认的报价不可再修改，如需调整请与客户协商。</div>
  </div>
  <div style="height:80px;"></div>
</div>
<div style="position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);padding:12px 16px 24px;display:flex;gap:10px;">
  <button class="btn btn-outline" onclick="goChat('engineer')" style="flex:1;height:46px;font-size:13.5px;">💬 继续沟通</button>
  <button class="btn btn-primary" onclick="go('quote-submit')" style="flex:1;height:46px;font-size:13.5px;">✏️ 修改报价</button>
</div>
`},

{id:'eng-chatlist',name:'10.工程师会话列表',bg:'#fff',html:`

<div class="navbar" style="border-bottom:1px solid var(--border);"><span style="font-size:17px;font-weight:700;">消息</span><span onclick="toggleEngChatSearch()" style="cursor:pointer;font-size:16px;">🔍</span></div>
<div id="engChatSearchBar" style="display:none;padding:8px 14px;border-bottom:1px solid var(--border);background:#fff;"><div class="input-box"><span>🔍</span><input id="engChatSearchInput" oninput="filterEngChatList()" placeholder="搜索联系人或需求关键词" autofocus></div></div>
<div style="padding:8px 16px 0;font-size:10.5px;color:var(--text-3);">💡 左滑或点击右侧 🗑️ 可删除会话</div>
<div class="section" style="padding-top:2px;">
${[
  ['李先生','好的，那我们约明天上午沟通细节','2分钟前',true,'无人机机架结构强度分析'],
  ['王女士','已收到报价，我再考虑一下','1小时前',false,'电动车电池托架碰撞仿真'],

  <div onclick="goChat('engineer')" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer;">

      <div style="font-size:11px;color:var(--primary);margin-top:2px;">关于：${e[4]}</div>
      <div style="font-size:12.5px;color:var(--text-2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e[1]}</div>

{id:'agreement-detail',name:'29z.用户协议',bg:'#fff',html:`
<div class="statusbar"><span>9:41</span><span>●●●● 5G 🔋</span></div>
<div class="navbar" style="border-bottom:1px solid var(--border);"><span onclick="go('about')">‹</span><span style="font-size:15px;font-weight:700;">用户协议</span><span></span></div>
<div class="section">
  <div class="card" style="padding:18px;font-size:12.5px;color:var(--text-2);line-height:2;">
    <div style="font-size:15px;font-weight:800;color:var(--text-1);text-align:center;">仿真通用户服务协议</div>
<div style="font-size:10.5px;color:var(--text-3);text-align:center;margin-top:6px;">生效日期：2026年1月1日 ｜ 版本号：V3.2</div>
<div style="margin-top:14px;">欢迎使用仿真通平台（以下简称"本平台"）。本协议是您（以下简称"用户"）与仿真通平台运营方（以下简称"平台方"）之间关于使用本平台服务所订立的协议。请您在注册、登录或使用本平台服务前，仔细阅读并充分理解本协议全部内容，特别是加粗条款。您一旦点击"同意"并完成注册，即表示您已阅读、理解并同意接受本协议的全部内容。</div>

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第一条　定义</div>
1.1　本平台：指仿真通网站、App及关联小程序等仿真通品牌下的产品与服务。<br>
1.2　客户：指在本平台发布仿真服务需求、寻求工程师提供仿真分析服务的用户。<br>
1.3　工程师：指在本平台注册、承接仿真服务需求并提供技术服务的用户。<br>
1.4　平台方：指负责本平台运营、维护及提供技术支持的运营主体。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第二条　账号注册与身份管理</div>
2.1　用户账号以<b>手机号或微信号</b>为唯一标识，同一手机号或微信号仅可对应一个账号。<br>
2.2　用户在注册时须选择"客户"或"工程师"身份，同一账号原则上只能持有一种身份；确需变更身份的，须联系平台客服审核处理，且不影响历史订单记录。<br>
2.3　用户须完成实名认证（填写真实姓名、身份证号并上传身份证照片）方可发布需求、接单或申请提现；<b>为防止一人多号、刷单套取补贴等作弊行为，同一身份证信息最多只能完成一个账号的实名认证</b>。<br>
2.4　用户应对账号密码及登录状态自行妥善保管，因用户保管不当导致的账号被盗用、信息泄露等后果由用户自行承担，但用户有权在发现账号异常后第一时间通知平台方采取保护措施。<br>
2.5　用户承诺提供的注册信息真实、准确、完整、合法，如信息发生变更应及时更新；因信息不实或未及时更新导致的损失由用户自行承担。<br>
2.6　<b>个人用户与企业/工作室用户的区分适用：</b>以自然人身份完成实名认证的工程师用户，适用本协议关于"个人工程师"的相关条款（如发票由平台代开、按个人费率结算）；以企业或个体工商户主体入驻并完成企业资质认证的工程师用户（以下简称"企业用户"），适用本协议关于"企业工程师"的相关条款，包括但不限于自行开具发票、企业信息公示、企业对其名下账号操作行为承担连带责任等。企业用户须额外提供营业执照等主体资质材料，具体认证流程见资质认证页说明；同一企业主体名下可申请开通多个子账号，但须在企业管理后台统一管理，且需对子账号的违规行为承担相应责任。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第三条　平台服务性质</div>
3.1　本平台系为客户与工程师提供信息展示、需求撮合、在线沟通、担保交易、纠纷协调等中介服务的技术平台，<b>平台本身不直接参与具体仿真分析工作的实施，不对工程师提供的技术服务成果承担直接责任</b>，但平台承诺按本协议及《平台交易规则》履行担保交易、审核监督及纠纷处理义务。<br>
3.2　客户发布需求后，平台内任意通过实名认证的工程师均可主动联系客户并报价，客户享有自主选择工程师的权利，平台不作强制指定。<br>
3.3　平台可根据运营需要，对工程师进行等级评定（认证/新秀/成长/资深/金牌/首席）、对客户与工程师进行信用评分，并据此提供差异化的服务权益，具体规则见《平台交易规则》及信用分相关说明。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第四条　用户行为规范</div>
用户在使用本平台服务过程中，<b>不得从事以下行为</b>：<br>(1) 诱导、要求对方脱离平台进行线下私下交易，规避平台担保与抽成机制；<br>(2) 提供虚假身份信息、虚假资质证明、虚假业绩案例；<br>(3) 恶意刷单、虚构交易、操纵评价、骚扰或诋毁其他用户；<br>(4) 利用本平台从事任何违反法律法规、损害国家利益或社会公共利益的活动；<br>(5) 上传、传播侵犯他人知识产权、商业秘密或隐私权的内容；<br>(6) 利用系统漏洞或技术手段侵入、干扰、破坏本平台正常运行。<br>违反上述行为的，平台方有权依据《平台违规处罚规则》采取警告、限流、功能冻结直至永久封禁账号等措施，并保留追究法律责任的权利。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第五条　交易与费用</div>
5.1　客户与工程师达成合作后，交易资金由平台担保交易系统暂存，待客户确认交付成果满意后再结算放款给工程师，具体流程见《平台交易规则》。<br>
5.2　平台按订单金额向交易双方收取相应的平台担保服务费/技术服务抽成费，费率标准根据工程师等级、订单类型等因素动态调整，具体费率以下单时页面实际展示及《平台交易规则》所载费率表为准。<br>
5.3　仿真币为平台发行的营销权益工具，仅可用于抵扣服务费、兑换曝光权益等站内场景，<b>不具有法定货币属性，不可提现、不可转让、不可折算为现金</b>，具体规则以钱包页面说明为准。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第六条　知识产权</div>
6.1　本平台的软件著作权、商标、界面设计、文案内容等知识产权归平台方所有，未经许可不得复制、传播、修改或用于商业用途。<br>
6.2　用户在需求描述、案例展示、聊天沟通中上传的图纸、模型、文档等资料的知识产权归上传方所有；平台仅在提供撮合服务所必需的范围内使用该资料，不会用于其他商业目的。<br>
6.3　工程师交付的仿真分析报告、模型文件等成果物的知识产权归属，由客户与工程师双方在订单沟通中自行约定；如无特别约定，视为归属出资方（客户），但工程师保留将其作为不涉及客户商业机密的匿名化案例展示于个人主页的权利。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第七条　免责与责任限制</div>
7.1　因不可抗力（包括但不限于自然灾害、政府行为、网络运营商故障等）导致本平台服务中断或用户损失的，平台方不承担赔偿责任，但会尽合理努力减少影响并及时恢复服务。<br>
7.2　对于用户违反本协议约定私下交易所产生的纠纷及损失，平台方不承担担保、仲裁及赔偿责任。<br>
7.3　除法律法规明确规定或平台在《平台交易规则》中另行承诺的担保、赔付义务外，平台方在任何情况下对用户的赔偿责任以该用户因该项服务向平台支付的费用总额为限。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第八条　协议的变更与终止</div>
8.1　平台方有权根据法律法规变化及业务发展需要修订本协议，修订后的协议将通过站内公告、消息通知等方式提前向用户展示；若用户不同意修订内容，可停止使用本平台服务并申请注销账号，继续使用则视为接受修订后的协议。<br>
8.2　用户可依据《账号与安全》页面流程随时申请注销账号；账号注销后，本协议对该用户即终止，但不影响注销前已产生的权利义务（如已完成订单的结算、纠纷处理、法律责任追究等）。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第九条　争议解决</div>
本协议的订立、效力、解释、履行及争议解决均适用中华人民共和国大陆地区法律。因本协议引起的或与本协议有关的任何争议，双方应友好协商解决；协商不成的，任何一方均可向平台方运营主体所在地有管辖权的人民法院提起诉讼。

<div style="margin-top:18px;font-size:10.5px;color:var(--text-3);">本协议未尽事宜，参见《仿真通隐私政策》《平台交易规则》及各功能页面内的专项规则说明，上述文件与本协议共同构成完整协议体系。</div>

{id:'privacy-detail',name:'29y.隐私政策',bg:'#fff',html:`
<div class="statusbar"><span>9:41</span><span>●●●● 5G 🔋</span></div>
<div class="navbar" style="border-bottom:1px solid var(--border);"><span onclick="go('about')">‹</span><span style="font-size:15px;font-weight:700;">隐私政策</span><span></span></div>
<div class="section">
  <div class="card" style="padding:18px;font-size:12.5px;color:var(--text-2);line-height:2;">
    <div style="font-size:15px;font-weight:800;color:var(--text-1);text-align:center;">仿真通隐私政策</div>
<div style="font-size:10.5px;color:var(--text-3);text-align:center;margin-top:6px;">生效日期：2026年1月1日 ｜ 版本号：V3.2</div>
<div style="margin-top:14px;">仿真通平台（以下简称我们）深知个人信息对您的重要性，将严格按照法律法规要求，采取相应安全保护措施，致力于保护您的个人信息安全可控。请在使用我们的产品和服务前，仔细阅读并了解本隐私政策。</div>

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">一、我们收集的信息</div>
<b>1.1 账号注册信息：</b>手机号码或微信开放平台唯一标识（用于账号登录与身份识别）。<br>
<b>1.2 实名认证信息：</b>真实姓名、身份证号码、身份证正反面照片，用于核验操作者与证件本人一致性，防止冒用他人身份及一人多号作弊。<br>
<b>1.3 服务使用信息：</b>需求描述、上传的模型/图纸/文档文件、报价记录、订单信息、支付信息（我们不存储您的银行卡号、密码等敏感支付信息，该部分由持有相应资质的第三方支付机构处理）。<br>
<b>1.4 沟通记录：</b>您与其他用户在平台内的聊天消息记录。<br>
<b>1.5 设备与日志信息：</b>设备型号、操作系统、IP地址、访问日期时间、崩溃日志等，用于保障服务稳定与安全。<br>
<b>1.6 其他信息：</b>发票开具所需的抬头、税号、开户行信息（如适用）；地址信息（如适用）。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">二、我们如何使用信息</div>
2.1　用于账号注册、登录及身份核验，保障账号唯一性与安全性。<br>
2.2　用于向您展示服务信息、促成客户与工程师之间的撮合沟通与交易。<br>
2.3　<b>聊天记录仅用于交易安全监测以及纠纷仲裁取证</b>，我们不会将您的聊天内容用于广告推荐、内容分析等其他商业用途，也不会向无关第三方披露。<br>
2.4　用于处理售后纠纷、仲裁裁决、信用评分计算及违规处罚判定。<br>
2.5　用于向您发送服务通知、订单提醒、安全提示等必要信息；营销类通知您可在消息设置中自主选择是否接收。<br>
2.6　用于开具发票、履行税务申报等法定义务。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">三、设备权限使用说明</div>
为实现相应功能，我们可能会申请调用您设备的以下权限，<b>均遵循"非必要不申请、按需申请"原则</b>，您可随时在设备系统设置中关闭相应权限（关闭后可能导致对应功能无法使用，但不影响其他功能的正常使用）：<br>
<b>3.1 相机/相册权限：</b>用于拍摄或上传身份证照片完成实名认证、上传需求相关的图纸/图片资料、上传聊天中的图片附件、上传案例封面图及成果截图等场景，仅在您主动触发拍照/选图操作时申请。<br>
<b>3.2 存储/文件权限：</b>用于选择并上传模型文件（.step/.iges等）、技术文档、资质证明材料等，以及保存您下载的报告、发票、邀请海报等文件到本地。<br>
<b>3.3 通知权限：</b>用于向您推送新消息、订单状态变更、纠纷处理进度等提醒，您可在"消息通知设置"中按类别自主开关。<br>
<b>3.4 网络状态权限：</b>用于判断当前网络连接情况，优化上传下载体验及异常提示。<br>本平台<b>不会申请与核心业务无关的权限</b>（如麦克风、通讯录、位置精确定位等），若后续因新增功能确需申请其他权限，我们会通过弹窗单独征得您的同意并说明用途。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">四、信息存储与保护</div>
3.1　<b>身份证号码等敏感信息采用加密存储</b>，我们采用符合行业标准的安全防护措施防止信息被未经授权访问、篡改或泄露。<br>
3.2　您的个人信息存储于中华人民共和国境内的服务器，原则上不向境外传输。<br>
3.3　我们仅在实现本政策所述目的所必需的期间内保留您的个人信息；账号注销后，我们将按照法律要求删除或匿名化处理相关个人信息，但<b>法律法规要求留存的交易凭证、发票记录（通常为交易完成后5-10年）不因账号注销而删除</b>。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">五、信息共享与披露</div>
4.1　<b>未经您的同意，我们不会向任何第三方公司、组织或个人披露您的个人信息</b>，除非属于以下情形：<br>（1）事先获得您的明确同意；<br>（2）根据适用的法律法规、法律程序要求、强制性行政或司法要求所必须提供；<br>（3）与提供支付、开票、云存储等必要服务的合作方在其提供服务所必需的范围内共享，我们会与其签署严格的保密协议；<br>（4）在纠纷仲裁、举报调查过程中，向涉事双方披露必要的举证材料以核实责任归属。<br>4.2　我们不会与第三方进行个人信息的交易、出售或出租。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">六、您的权利</div>
您对自己的个人信息享有以下权利：<br>5.1　<b>查阅、更正权：</b>可在账号与安全页面查询和修改部分个人信息。<br>5.2　<b>删除权：</b>符合法律规定情形时，可申请删除相关个人信息。<br>5.3　<b>注销权：</b>可随时在账号与安全页申请注销账号，进入15天冷静期后正式删除相关数据。<br>5.4　<b>撤回同意权：</b>对于基于同意收集的信息（如营销通知），您可随时撤回同意。如需行使上述权利，可通过客服与工单联系我们处理，我们将在15个工作日内予以响应。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">七、未成年人保护</div>
本平台主要服务于具备完全民事行为能力的成年用户。若您为未成年人，请在监护人陪同下阅读本政策，并在监护人同意后使用本平台服务。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">八、政策更新</div>
我们可能适时对本政策进行修订，修订后的版本将通过站内公告或消息通知的方式告知您。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">九、联系我们</div>
如您对本政策或个人信息保护事宜有任何疑问、意见或投诉，可通过关于我们页面或在线客服（工作日9:00-21:00）与我们联系，我们将尽快为您处理。<br><br>
    1. 我们收集手机号、身份证信息用于账号注册与实名核验，采用加密存储；<br>
    2. 聊天记录仅用于交易安全监测与纠纷仲裁取证，不用于其他商业用途；<br>
    3. 未经您同意，不会向第三方披露您的个人信息（法律要求除外）；<br>
    4. 您可随时在"账号与安全"中申请注销账号并删除相关数据；<br>
    5. 更多条款详见完整隐私政策文本（此处为原型演示内容）。
  </div>
  <div style="height:20px;"></div>
</div>

{id:'trade-rules-detail',name:'29x.平台交易规则',bg:'#fff',html:`
<div class="statusbar"><span>9:41</span><span>●●●● 5G 🔋</span></div>
<div class="navbar" style="border-bottom:1px solid var(--border);"><span onclick="go('about')">‹</span><span style="font-size:15px;font-weight:700;">平台交易规则</span><span></span></div>
<div class="section">
  <div class="card" style="padding:18px;font-size:12.5px;color:var(--text-2);line-height:2;">
    <div style="font-size:15px;font-weight:800;color:var(--text-1);text-align:center;">仿真通平台交易规则</div>
<div style="font-size:10.5px;color:var(--text-3);text-align:center;margin-top:6px;">生效日期：2026年1月1日 ｜ 版本号：V3.2</div>
<div style="margin-top:14px;">本规则是《仿真通用户服务协议》的补充协议，用于详细约定客户与工程师在本平台达成交易、支付结算、售后纠纷、违规处罚等具体流程与标准。本规则与用户协议冲突之处，以本规则为准（仅限交易相关事项）。</div>

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第一条　需求发布与报价</div>
1.1　客户发布需求后，需求内容对平台内全部通过实名认证的工程师公开可见，任意工程师均可主动联系客户沟通并提交报价，客户享有完全自主的选择权，平台不作强制指定或干预。<br>
1.2　为避免恶性价格战，工程师报价时<b>无法查看其他工程师的具体报价金额，也看不到已有多少工程师联系或报价</b>，报价决策应基于自身专业判断与成本核算。<br>
1.3　客户可随时编辑、下架或删除尚未成交的需求；报价工程师亦可在客户确认前撤回或修改报价。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第二条　担保交易流程</div>
2.1　客户确认选择某位工程师的报价后，需通过平台完成支付，<b>支付款项由平台担保交易系统暂存，不会立即打款给工程师</b>。<br>
2.2　工程师按约定周期完成交付后，客户应在验收满意后点击确认收货，平台在扣除相应服务费后将余款结算至工程师账户余额。<br>
2.3　若客户在合理期限内未确认收货且未提出异议，系统将按约定自动确认收货（默认交付后7天自动确认，具体以订单页提示为准）。<br>
2.4　<b>平台收取的担保服务费包含交易资金担保、客服响应支持、纠纷协调与仲裁服务的成本</b>，费率随订单金额、工程师等级浮动，具体以下单页实际展示金额为准。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第三条　工程师等级与费率体系</div>
3.1　工程师等级分为认证（完成实名及基础资质，费率15%）、新秀（累计1-9单且好评率≥85%，费率15%）、成长（累计10-29单且好评率≥90%，费率10%）、资深（累计30-59单且好评率≥95%、纠纷率低于2%，费率8%）、金牌（累计60-119单、好评率≥97%、纠纷率低于1%且通过资质复审，费率8%并享报价曝光优先）、首席（累计120单以上、好评率≥98%、纠纷率低于0.5%且通过年度评定，费率8%并享更高曝光权重）六档。<br>
3.2　等级相关的滚动指标（好评率、纠纷率）按最近30单/近6个月数据实时刷新展示，但<b>实际结算费率按季度统一调整</b>，避免因单笔波动频繁跳档；连续2个季度不达标才会降级。<br>
3.3　纠纷判负是否计入工程师纠纷率，须经平台客服/仲裁人工复核责任归属后确定，客户方原因导致的纠纷不计入工程师考核。<br>
3.4　金牌工程师资质每12个月复审一次，复审不通过降为资深等级；详细标准见金牌工程师认证体系说明页。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第四条　售后、退款与纠纷处理</div>
4.1　交付存在争议的，客户可选择要求返工修改、要求补充交付材料、申请纠纷协调或申请退款四种处理路径，建议优先选择前两种以快速解决问题。<br>
4.2　<b>申请退款后，工程师须在48小时内回应</b>（同意退款/拒绝/提出协商方案）；若工程师拒绝或超时未响应，客户可一键升级申请平台客服介入仲裁。<br>
4.3　纠纷协调流程为：提交纠纷→双方举证（可持续补充证据，材料不可删除或修改以保证证据链完整）→协商/仲裁→处理完成；若72小时内双方均无新动作或任一方主动申请，将转入客服人工仲裁。<br>
4.4　仲裁裁决内容包括但不限于全额退款、驳回申诉、部分退款、要求补充交付后结案等，裁决结果同步计入双方信用分及工程师纠纷率考核，<b>裁决一经确认原则上不可撤销</b>。<br>
4.5　处理期间涉及的订单资金始终处于平台担保冻结状态，不会打款给工程师；若相关款项已完成结算并进入工程师可提现余额，事后被判定需退款的，将从其冻结余额中相应扣除。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第五条　提现与开票</div>
5.1　工程师可提现余额为已完成结算、扣除服务费后的订单收入；提现时平台按约定费率（详见提现页展示，当前为0.6%）收取手续费，¥5,000以内的提现由系统24小时内自动到账；超过¥5,000的提现将进入人工风控复核，一般1个工作日内到账。<br>
5.2　若可提现余额对应的订单事后被客户申诉或进入仲裁，该部分金额将被临时标记为冻结中，仲裁结束后自动解冻或按裁决结果扣除，不影响尚未结算部分。<br>
5.3　客户可就已完成订单向平台申请开具发票；具备开票资质的工程师主体订单由其自行开票，个人工程师订单由<b>平台统一代开发票</b>，开票主体与内容与工程师自行开票具有同等法律效力。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第六条　信用分与违规处罚</div>
6.1　信用分从安全交易、履约及时、沟通友好、社区行为四个维度综合计算，客户与工程师分别独立计分；信用分低于600将限制发布需求/报价频次等部分功能。<br>
6.2　平台对违规行为采取<b>提醒→流量限制→功能冻结→永久封禁</b>四级递进式处罚机制，具体触发情形及处罚标准详见平台违规处罚规则说明页；其中<b>纠纷判负（仲裁判定己方存在过错）固定扣除信用分15分</b>，为二级处罚下限档、不随档位浮动，与信用分页记录及运营配置一致；一/二级处罚可在信用分页面对具体记录发起申诉，三/四级处罚需通过人工复核工作流处理。<br>
6.3　举报处理：任何用户发现违规行为（诱导私下交易、虚假资质、骚扰等）均可在聊天页或个人主页发起举报，平台将在24小时内核实并作出处理，恶意举报将影响举报人自身信用分。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第七条　仿真币权益规则</div>
仿真币可通过注册、实名认证、每日签到、邀请好友、评价订单等行为获得，可用于抵扣订单服务费（单笔最高抵扣30%）、兑换需求置顶曝光券、认证加急审核、平台活动优惠券等站内权益；<b>有效期为获得后12个月，过期自动清零</b>，不可提现、转让或折算现金。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第八条　交付保障承诺</div>
8.1　平台为已完成支付的订单提供以下交付保障承诺，作为平台担保服务的一部分，<b>无需额外购买、自动生效</b>：<br>
（1）<b>超时赔付</b>：自约定交付时限次日起，每逾期1个工作日自动向客户赔付订单金额的0.5%（累计上限10%），无需客户申请；工程师在订单页提交延期申请并经客户同意后，逾期计时暂停，延期期间不计入超时赔付。<br>
（2）<b>逾期全额退款</b>：工程师逾期后48小时内既不交付也未申请延期协商的，客户可一键申请全额退款，系统自动判定并原路退回；对该自动判定结果不服的，可在信用分页面向平台发起申诉复核。<br>
（3）<b>里程碑分期付款</b>：订单金额≥¥10,000的，支持两期支付（首款50%开工、尾款50%验收后放款），全程由平台担保，降低大额订单的资金风险。<br>
（4）<b>含2次免费修改</b>：客户可就交付成果提出修改意见，工程师应在免费修改次数内响应处理；超出部分由双方协商。<br>
8.2　本条承诺与第四条、第五条相关规则并行适用；如与既有条款存在冲突，以对客户更有利的口径为准。<br>
8.3　超时赔付、逾期全额退款等自动判定的资金处理将同步记入订单流水与操作日志，供双方与平台复核追索。

<div style="font-size:13.5px;font-weight:800;color:var(--primary);margin-top:18px;">第九条　规则的解释与修订</div>
本规则由平台方负责解释；平台方可根据业务发展及运营需要修订本规则相关条款（如费率标准、等级门槛、处罚力度等），修订后将提前通过站内公告或消息中心通知，新规则自公告生效之日起适用于新发生的订单，不影响已在执行中订单的既有约定。<br><br>
    1. 客户发布需求后，任意工程师均可主动联系并报价，客户自由选择；<br>
    2. 客户支付后资金由平台担保，验收满意后再放款给工程师；<br>
    3. 平台按订单金额收取担保服务费，费率详见"结算明细-费率规则"；<br>
    4. 交付有争议时可申请售后/纠纷协调，平台客服将介入处理；<br>
    5. 更多细则详见完整交易规则文本（此处为原型演示内容）。
  </div>
  <div style="height:20px;"></div>
</div>
`},

{id:'rate-rules',name:'32g.平台费率规则',bg:'#fff',html:`
<div class="statusbar"><span>9:41</span><span>●●●● 5G 🔋</span></div>
<div class="navbar" style="border-bottom:1px solid var(--border);"><span>‹</span><span style="font-size:15px;font-weight:700;">工程师等级与费率规则</span><span></span></div>
<div class="section">
  <div class="card" style="padding:18px;background:linear-gradient(135deg,#111827,#374151);border:none;text-align:center;">
    <div style="font-size:12px;color:rgba(255,255,255,.7);">等级设计原则</div>
    <div style="font-size:15px;font-weight:800;color:#fff;margin-top:6px;">持续做得好，才能一直保持等级</div>
    <div style="font-size:10.5px;color:rgba(255,255,255,.6);margin-top:4px;">等级看长期累计，也看近期表现，双向考核</div>
  </div>
</div>
<div class="section" style="padding-top:0;">
  <div class="section-title">六档等级标准</div>
  ${[
    ['🪪','认证工程师','完成实名认证 + 基础资质资料（0单起步）','15%','入驻即得，客户看到的是\"已认证\"而非\"新手\"，扫清新人接单的第一道信任障碍','#EEF1FF,#F5F0FF','var(--primary)'],
    ['🆕','新秀工程师','累计1-9单 + 好评率≥85%','15%','完成首单后自动晋级，随单量积累逐步进入成长档','#FFF7ED,#FFEEDD','#9A3412'],
    ['📈','成长工程师','累计10-29单 + 好评率≥90%','10%','订单量与信誉逐步积累，费率自动下降','#EEF1FF,#F5F0FF','var(--primary)'],
    ['💎','资深工程师','累计30-59单 + 好评率≥95% + 纠纷率&lt;2%','8%','长期稳定的高质量交付记录，享受平台优惠费率','#F5F0FF,#EEF1FF','#6C4CFF'],
    ['🏆','金牌交付工程师','累计60-119单 + 好评率≥97% + 纠纷率&lt;1% + 资质复审通过','8%（享报价曝光优先）','面向客户展示的最高信任标识，新需求优先推送 + 客户端报价列表排序加权','#FFFBEB,#FFF6E5','#B54708'],
    ['👑','首席工程师','累计120单以上 + 好评率≥98% + 纠纷率&lt;0.5% + 年度评定','8%（享更高曝光权重）','工程师内部最高等级：更大流量倾斜、专属客服通道、平台活动优先邀请','#111827,#374151','#F5A623']
  ].map((e,i)=>`
  <div class="card" style="padding:16px;margin-bottom:12px;background:linear-gradient(135deg,${e[5]});border:none;${i===4?'cursor:pointer;':''}" ${i===4?`onclick="go('gold-cert')"`:''}>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:20px;">${e[0]}</span><span style="font-size:13.5px;font-weight:700;color:${e[6]};">${e[1]}</span></div>
      <span style="font-size:18px;font-weight:800;color:${e[6]};">${e[3]}</span>
    </div>
    <div style="font-size:11px;color:${e[6]};margin-top:6px;font-weight:600;opacity:.9;">达标条件：${e[2]}</div>
    <div style="font-size:11px;color:${e[6]};margin-top:6px;line-height:1.6;opacity:.85;">${e[4]}</div>
    ${i===4?'<div style="margin-top:8px;font-size:10.5px;color:#B54708;font-weight:700;">查看金牌认证细则 ›</div>':''}
  </div>`).join('')}
</div>
<div class="section">
  <div class="section-title">⚙️ 动态等级机制：滚动展示 + 季度调档</div>
  <div class="card" style="padding:16px;background:linear-gradient(135deg,#EEF1FF,#F5F0FF);border:none;">
    <div style="font-size:12.5px;font-weight:700;color:var(--primary);">等级不是终身制，资深/金牌需持续维护</div>
    <div style="display:flex;gap:10px;margin-top:12px;">
      <div style="flex:1;background:#fff;border-radius:10px;padding:12px;">
        <div style="font-size:11px;font-weight:700;color:var(--primary);">📊 日常：滚动展示</div>
        <div style="font-size:10px;color:var(--text-2);margin-top:6px;line-height:1.6;">每完成一单，系统自动用<b>最近30单/近6个月</b>数据滚动重算好评率、纠纷率，个人主页等级标识实时刷新，让客户看到的始终是"当下"状态</div>
      </div>
      <div style="flex:1;background:#fff;border-radius:10px;padding:12px;">
        <div style="font-size:11px;font-weight:700;color:#6C4CFF;">💰 费率：季度批次调档</div>
        <div style="font-size:10px;color:var(--text-2);margin-top:6px;line-height:1.6;">即使滚动指标天天变，<b>实际结算费率每季度统一调整一次</b>，避免因单笔波动频繁跳档，收入更稳定可预期</div>
      </div>
    </div>
    <div style="font-size:11.5px;color:var(--primary);margin-top:12px;line-height:1.9;">
    • 季度调档时取当季末的滚动指标快照，与等级门槛比对，决定下一季度生效的费率与展示等级<br>
    • 连续<b>2个季度</b>不达标才会降级，单季波动（如偶遇难缠客户）不会立刻掉档<br>
    • 金牌工程师的资质复审为<b>年度复审</b>，复审不通过直接降为资深<br>
    • 认证、新秀两档暂不设降级逻辑，门槛低、波动影响小
    </div>
  </div>
  <div class="card" style="padding:16px;margin-top:10px;background:var(--danger-light);border:none;">
    <div style="font-size:12.5px;font-weight:700;color:var(--danger);">⚖️ 纠纷类指标：先人工复核，再计入考核</div>
    <div style="font-size:11px;color:#B42318;margin-top:8px;line-height:1.8;">与好评率/单量等纯数据指标不同，纠纷的责任归属往往涉及沟通误会、需求理解偏差等复杂情况，不能靠算法一刀切。系统会先把纠纷标记进入<b>复核队列</b>，由平台客服/仲裁判定责任方后，<b>只有判定工程师方存在过错的纠纷才计入其纠纷率</b>，避免客户方原因造成的纠纷误伤工程师等级</div>
  </div>
  <div class="card" style="padding:12px 14px;margin-top:10px;background:#F9FAFB;border:none;">
    <div style="font-size:10.5px;color:var(--text-3);line-height:1.7;">ℹ️ 好评率计算设有<b>最低单量基数</b>：单个工程师订单量不足10单时，好评率不纳入等级考核，避免小样本失真</div>
  </div>
</div>
<div class="section">
  <div class="section-title">为什么这样设计？</div>
  <div class="card" style="padding:16px;">
    <div style="font-size:12.5px;color:var(--text-2);line-height:1.9;">
    • 平台为每一单提供担保交易、纠纷仲裁、客服支持等服务，认证/新秀档费率覆盖这部分获客与保障成本<br>
    • 随着您在平台上完成的订单量增加、口碑积累，纠纷风险和平台介入成本随之降低，费率也相应下降<br>
    • 金牌及以上等级不再降低费率，而是给予<b>报价曝光优先</b>：新需求发布时优先推送给金牌/首席工程师，客户端报价列表默认排序中也享有等级加权，因为8%已是平台可持续经营的费率下限，等级的核心价值是让优质工程师更容易被客户看到、选中<br>
    • 升级看<b>长期积累</b>，降级看<b>近期表现</b>，两套指标分开算，标签才能持续代表"当下"的服务质量而非"曾经"
    </div>
  </div>

{id:'penalty-rules',name:'33c.平台违规处罚规则',bg:'#fff',html:`

</div>
<div class="section" style="padding-top:0;">
  <div class="section-title">四级处罚阶梯</div>
  ${[
    ['🟡','一级 · 提醒/警告','首次轻微违规（如沟通措辞不当、未及时更新信息等）','系统自动提醒，扣除信用分 4 分，不影响接单','#F5F7FF,#EEF1FF','var(--primary)'],

    ['🔴','三级 · 功能冻结','严重违规（误导私交、虚假资质）或信用分低于600','扣除信用分 60-80 分，暂停发布/接单权限，需提交整改说明才可恢复，类似闲鱼“警告-限制发布”机制','#FEECEC,#FFE0DE','var(--danger)'],
    ['⚫','四级 · 永久封禁','威胁交易安全（诈骗、伪造证书、中伤造谣）','扣除信用分 100 分并永久封禁账号，冻结待提现余额中未争议部分可申请原路退还，情节严重移交司法机关处理','#111827,#374151','#fff']
  ].map((e,i)=>`
  <div class="card" style="padding:16px;margin-bottom:12px;background:linear-gradient(135deg,${e[4]});border:none;">
    <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:18px;">${e[0]}</span><span style="font-size:13.5px;font-weight:700;color:${e[5]};">${e[1]}</span></div>
    <div style="font-size:11px;color:${e[5]};margin-top:8px;font-weight:600;opacity:.9;">触发情形：${e[2]}</div>
    <div style="font-size:11px;color:${e[5]};margin-top:6px;line-height:1.6;opacity:.85;">处罚措施：${e[3]}</div>

</div>
<div class="section">
  <div class="section-title">具体违规行为对照表 <span class="more">按行为类别分组 · 共7类20项</span></div>
  ${[
    ['🛡️','交易安全类',[
      ['纠纷判负（仲裁判定己方存在过错）','二级下限档 · -15分/次','仲裁判定存在过错时按此档单独执行，不随二级档位浮动，与信用分记录及运营配置一致'],

      ['诈骗/伪造实名认证','四级 · -100分','虚假身份注册、虚构项目骗取资金；永久封禁，冻结资金按争议规则处理并移交司法机关'],
      ['虚假发货/谎称已交付','三级→四级 · -60分','未实际交付却标记已交付骗取验收；一经查实直接功能冻结，涉及诈骗移交处理'],
      ['恶意拒收/恶意退款','二级→三级 · -30分','无正当理由拒不验收或反复申请退款干扰正常交易']
    ]],
    ['📋','信息真实性类',[
      ['虚假资质/虚假案例/虚假宣传','三级 · -60分','伪造证书、虚构案例数据、夸大服务能力误导客户；一经证实直接功能冻结'],
      ['冒用他人身份/盗用他人作品','三级→四级 · -70分','冒用他人实名信息注册、盗用他人图纸/模型/报告冒充自有成果'],
      ['需求或报价信息造假','二级→三级 · -40分','发布虚假预算、虚构需求、报价与承诺严重不符诱导成交']
    ]],
    ['⭐','信用评价类',[
      ['恶意刷单/自买自评','三级→四级 · -80分','虚构交易、小号互刷、自己给自己刷好评扰乱评价体系'],

    ]],
    ['💬','沟通行为类',[
      ['言语辱骂/人身攻击/骚扰','一级→三级 · -20~60分','按情节轻重递进：提醒→流量限制→功能冻结，多次骚扰直接冻结'],
      ['泄露他人隐私','二级→三级 · -40分','未经许可传播对方手机号、身份证号、聊天记录截图等'],

    ]],
    ['📄','内容合规类',[

      ['侵犯知识产权','三级→四级 · -70分','盗用他人专利、模型、图纸、报告用于商业牟利']

    ['⏱️','履约类',[
      ['交付超时/逾期未交付','一级→二级 · -10分/次','接单并收款后未按约定时限交付，频发超时直接影响接单权重与信用分，超过48小时自动触发赔付；「响应超时」不在此列（报价自愿，不响应即放弃，仅记录不扣分）'],
      ['中途加价/擅自变更交付内容','二级→三级 · -40分','未经协商单方面加价或改变交付范围，损害客户利益'],
      ['无故拒单/恶意拖延','二级→三级 · -30分','接单后无故取消或故意拖延，影响客户项目进度']
    ]],
    ['👤','账号类',[
      ['账号买卖/出租/多开小号','三级→四级 · -80分','出售、出租账号或批量注册小号套取新人权益'],
      ['恶意举报/虚假举报','一级→二级 · -15分','滥用举报功能干扰他人，扣除信用分并限制举报权限']
    ]]
  ].map(g=>`
  <div class="card" style="padding:16px;margin-top:10px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
      <span style="font-size:16px;">${g[0]}</span>
      <span style="font-size:13px;font-weight:700;">${g[1]}</span>
      <span style="font-size:10px;color:var(--text-3);margin-left:auto;">${g[2].length}项</span>

        <div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:12.5px;font-weight:600;">${e[0]}</span><span class="tag tag-warn">${e[1]}</span></div>
        <div style="font-size:10.5px;color:var(--text-3);margin-top:4px;line-height:1.6;">${e[2]}</div>
      </div>`).join('')}
  </div>`).join('')}
</div>
<div class="section">
  <div class="section-title">申诉与纠错机制</div>
  <div class="card" style="padding:16px;background:var(--primary-light);border:none;">
    <div style="font-size:12px;color:var(--primary);line-height:1.9;">
    • 一/二级处罚可在信用分页面对具体记录发起申诉，客服1-2个工作日内复核<br>
    • 三/四级处罚对应统一入口人工复核工作流，需提交书面说明或相关证据<br>

    • 所有处罚均同步计入信用分（按档位扣分）与操作日志，处罚记录长期保留，供后续纠纷仲裁复核参考
    </div>
  </div>
  <div style="height:20px;"></div>

`},

{id:'admin-config',name:'45.运营配置',bg:'#fff',html:`

    ${[['新用户注册奖励','200','币','完成注册即到账，客户/工程师均适用'],['单笔抵扣服务费上限','30','%','单笔订单最多用仿真币抵扣的服务费比例'],['仿真币有效期','12','个月','超期未使用的仿真币将自动清零']].map((e,i,arr)=>`

{id:'service-agreement',name:'13c.服务约定确认',bg:'#fff',html:`
<div class="statusbar"><span>9:41</span><span>●●●● 5G 🔋</span></div>
<div class="navbar" style="border-bottom:1px solid var(--border);"><span onclick="go('payment')">‹</span><span style="font-size:15px;font-weight:700;">服务约定确认</span><span onclick="go('cs-ticket')" style="font-size:12px;color:var(--primary);cursor:pointer;">🎧 咨询</span></div>

  <div class="card" style="padding:16px;margin-top:12px;">

  </div>
  <div class="card" style="padding:16px;margin-top:10px;">
    <div style="font-size:12.5px;font-weight:700;">交付周期与修改</div>
    <div style="font-size:11px;color:var(--text-2);margin-top:8px;line-height:1.8;">交付周期：自支付成功起 3 个工作日（逾期将触发超时赔付，见下）<br>免费修改次数：2 次，超出部分由双方协商<br>工程师申请延期且您同意后，交付计时暂停</div>
  </div>
  <div class="card" style="padding:16px;margin-top:10px;">
    <div style="font-size:12.5px;font-weight:700;">知识产权归属</div>
    <div style="font-size:11px;color:var(--text-2);margin-top:8px;line-height:1.8;">本次交付的分析报告、模型文件等成果物知识产权归您（客户）所有；工程师保留将不涉及您商业机密的匿名化内容作为个人案例展示的权利。您提供的图纸、模型、参数仅用于本次分析，工程师不得用于其他用途</div>
  </div>
  <div class="card" style="padding:16px;margin-top:10px;">
    <div style="font-size:12.5px;font-weight:700;">保密条款</div>
    <div style="font-size:11px;color:var(--text-2);margin-top:8px;line-height:1.8;">双方对交易过程中知悉的图纸、模型、技术参数、商业信息承担保密义务，未经对方书面同意不得向第三方披露；如有保密协议（NDA）需求，可在沟通中与工程师协商签署</div>
  </div>
  <div class="card" style="padding:16px;margin-top:10px;">
    <div style="font-size:12.5px;font-weight:700;">退款与售后</div>

{id:'set-password',name:'24c.设置登录密码',bg:'#fff',html:`
<div class="statusbar"><span>9:41</span><span>●●●● 5G 🔋</span></div>
<div class="navbar" style="border-bottom:1px solid var(--border);"><span onclick="go('security')">‹</span><span style="font-size:15px;font-weight:700;">设置登录密码</span><span></span></div>
<div class="section">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
    ${[['①','验证原手机号'],['②','设置新密码'],['③','完成']].map((e,i)=>`
    <div style="display:flex;align-items:center;gap:6px;flex:1;">
      <div style="width:22px;height:22px;border-radius:50%;background:${setPasswordStep>=(i+1)?'var(--primary)':'#E4E7EC'};color:${setPasswordStep>=(i+1)?'#fff':'var(--text-3)'};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;">${setPasswordStep>(i+1)?'✓':e[0]}</div>
      <span style="font-size:11.5px;font-weight:700;color:${setPasswordStep>=(i+1)?'var(--text-1)':'var(--text-3)'};">${e[1]}</span>
      ${i<2?'<div style="flex:1;height:2px;background:'+(setPasswordStep>(i+1)?'var(--primary)':'#E4E7EC')+';margin:0 4px;"></div>':''}
    </div>`).join('')}
  </div>
  ${setPasswordStep===1?`
  <div class="card" style="padding:16px;background:linear-gradient(135deg,#EEF1FF,#F5F0FF);border:none;">
    <div style="font-size:13px;font-weight:700;color:var(--primary);">📱 第一步：验证原手机号</div>
    <div style="font-size:11px;color:var(--text-3);margin-top:6px;line-height:1.6;">为保障账号安全，设置登录密码前需先验证当前绑定的手机号</div>

  <div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:10px;background:#F9FAFB;border:none;">
    <span style="font-size:17px;">📱</span>
    <span style="font-size:15px;font-weight:800;flex:1;">138****2233</span>
    <span class="tag tag-primary">已验证</span>
  </div>

  </div>
  <div style="height:80px;"></div>
  `:setPasswordStep===2?`
  <div class="card" style="padding:16px;background:var(--success-light);border:none;">
    <div style="font-size:13px;font-weight:700;color:var(--success);">✅ 原手机号验证通过</div>
    <div style="font-size:11px;color:var(--text-3);margin-top:6px;line-height:1.6;">第二步：设置登录密码，设置后下次登录可<b>手机号+密码</b>或<b>验证码</b>两种方式任选</div>
  </div>

    <div style="font-size:11px;color:var(--primary);line-height:1.7;">建议使用<b>字母+数字</b>组合，长度不少于6位；若忘记密码，可在登录页点击「忘记密码」用验证码重置，不影响账号内数据</div>
  </div>
  <div style="height:80px;"></div>
  `:`
  <div style="display:flex;flex-direction:column;align-items:center;padding:40px 24px 0;text-align:center;">
    <div style="width:72px;height:72px;border-radius:50%;background:var(--success-light);display:flex;align-items:center;justify-content:center;font-size:34px;">✅</div>
    <div style="font-size:16px;font-weight:800;margin-top:16px;">登录密码设置成功</div>
    <div style="font-size:12px;color:var(--text-3);margin-top:8px;line-height:1.7;">下次登录可使用<b>手机号+密码</b>或<b>验证码</b>登录，两种方式均可正常使用</div>
  </div>
  <div class="card" style="padding:14px;margin-top:20px;background:var(--primary-light);border:none;display:flex;gap:10px;">
    <span style="font-size:16px;">🛡️</span>
    <div style="font-size:11px;color:var(--primary);line-height:1.6;">请妥善保管密码，勿告知他人；账号内订单记录、信用分、仿真币余额等均不受影响</div>
  </div>
  <div style="height:60px;"></div>
  `}
</div>
<div style="position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);padding:12px 16px 24px;display:flex;gap:10px;">
  ${setPasswordStep===1?`<button class="btn btn-primary" onclick="submitSetPasswordStep1()" style="width:100%;height:48px;font-size:15px;">下一步：设置新密码 ›</button>`:setPasswordStep===2?`
  <button class="btn btn-outline" onclick="setPasswordStep=1;renderSetPassword();" style="flex:1;height:48px;font-size:14px;">上一步</button>
  <button class="btn btn-primary" onclick="submitSetPasswordStep2()" style="flex:2;height:48px;font-size:15px;">✓ 确认设置</button>`:`<button class="btn btn-primary" onclick="setPasswordStep=1;go('security')" style="width:100%;height:48px;font-size:15px;">✓ 完成</button>`}
</div>
`},

{id:'admin-announce',name:'45d.公告管理',bg:'#F5F7FB',html:`

<div class="navbar" style="border-bottom:1px solid var(--border);"><span onclick="go('admin-home')">‹</span><span style="font-size:15px;font-weight:700;">公告管理</span><span onclick="showToast('公告数据已刷新')" style="font-size:12px;color:var(--primary);font-weight:700;cursor:pointer;">刷新</span></div>
<div class="section">
  <div class="card" style="padding:14px;background:var(--primary-light);border:none;display:flex;gap:8px;align-items:flex-start;">
    <span style="font-size:14px;">📢</span>
    <div style="font-size:10.5px;color:var(--primary);line-height:1.6;">统一管理平台公告：发布的公告将同步推送至用户「消息中心 → 系统通知」，费率调整、规则变更、活动通知等均在此发布；支持置顶与下线。</div>
  </div>
  <div class="section-title" style="margin-top:16px;">已发布公告</div>
  ${[
    ['关于调整平台担保服务费费率的通知','2026-08-01 发布 · 已推送全部用户','置顶中',true],
    ['618狂欢节优惠券发放说明','2026-06-10 发布 · 已推送全部用户','已下线',false],
    ['《平台交易规则》V3.2 更新公告','2026-01-01 发布 · 已推送全部用户','已下线',false]
  ].map(e=>`
  <div class="card" style="padding:14px 16px;margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:13px;font-weight:700;flex:1;padding-right:8px;">${e[0]}</span>
      <span class="tag ${e[3]?'tag-warn':'tag-gray'}" style="flex-shrink:0;">${e[2]}</span>
    </div>
    <div style="font-size:10.5px;color:var(--text-3);margin-top:6px;">${e[1]}</div>
    <div style="display:flex;gap:16px;margin-top:10px;">
      <span onclick="showToast('已${e[3]?'取消置顶':'置顶'}该公告')" style="font-size:11.5px;color:var(--primary);font-weight:600;cursor:pointer;">${e[3]?'取消置顶':'置顶'}</span>
      <span onclick="if(confirm('确定${e[2]==='已下线'?'重新发布':'下线'}该公告吗？')){showToast('操作成功');}" style="font-size:11.5px;color:${e[2]==='已下线'?'var(--success)':'var(--danger)'};font-weight:600;cursor:pointer;">${e[2]==='已下线'?'重新发布':'下线'}</span>
      <span onclick="if(confirm('确定删除该公告吗？删除后不可恢复')){this.closest('.card').style.display='none';showToast('公告已删除');}" style="font-size:11.5px;color:var(--text-3);font-weight:600;margin-left:auto;cursor:pointer;">删除</span>
    </div>
  </div>
`).join('')}
  <div class="section-title" style="margin-top:18px;">新建公告</div>
  <div class="card" style="padding:16px;">
    <span class="label-title" style="margin-bottom:6px;">公告标题</span>
    <div class="input-box"><input id="announceTitleInput" placeholder="请输入公告标题"></div>
    <span class="label-title" style="margin-bottom:6px;margin-top:14px;display:block;">公告内容</span>
    <div class="card" style="padding:14px;"><textarea id="announceContentInput" placeholder="请输入公告正文，支持换行分段..." style="border:none;width:100%;height:110px;font-size:13px;outline:none;resize:none;"></textarea></div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px;">
      <div onclick="this.classList.toggle('on');this.style.background=this.classList.contains('on')?'var(--primary)':'var(--border)';this.querySelector('div').style.left=this.classList.contains('on')?'20px':'2px'" class="on" style="width:40px;height:22px;border-radius:12px;background:var(--primary);position:relative;cursor:pointer;flex-shrink:0;"><div style="width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;left:20px;box-shadow:var(--shadow-sm);transition:.2s;"></div></div>
      <span style="font-size:12px;color:var(--text-2);">发布后置顶展示（仅1条生效）</span>
    </div>
    <button class="btn btn-primary" onclick="submitAnnounce()" style="width:100%;height:46px;font-size:14.5px;margin-top:16px;">📢 发布公告</button>
  </div>
  <div style="height:20px;"></div>
</div>
`},

// 为所有横向滚动区域(.hscroll)增加鼠标拖拽滑动支持，解决网页端鼠标无法像手指一样左右滑动的问题
(function(){
  let isDown=false,startX=0,scrollLeft=0,activeEl=null,moved=false;
  document.addEventListener('mousedown',function(e){
    const el=e.target.closest('.hscroll');
    if(!el)return;
    isDown=true;moved=false;activeEl=el;
    startX=e.pageX;
    scrollLeft=el.scrollLeft;
    el.style.cursor='grabbing';
  });
  document.addEventListener('mousemove',function(e){
    if(!isDown||!activeEl)return;
    const dx=e.pageX-startX;
    if(Math.abs(dx)>3)moved=true;
    activeEl.scrollLeft=scrollLeft-dx;
  });
  function endDrag(){
    if(activeEl)activeEl.style.cursor='';
    isDown=false;activeEl=null;
  }
  document.addEventListener('mouseup',endDrag);
  document.addEventListener('mouseleave',endDrag);
  // 阻止拖拽结束后误触发下方卡片的click
  document.addEventListener('click',function(e){
    if(moved){e.stopPropagation();e.preventDefault();moved=false;}
  },true);
  // 鼠标滚轮在.hscroll区域内也可直接左右滚动（垂直滚轮转横向）
  document.addEventListener('wheel',function(e){
    const el=e.target.closest('.hscroll');
    if(!el)return;
    if(Math.abs(e.deltaY)> Math.abs(e.deltaX)){
      el.scrollLeft+=e.deltaY;
      e.preventDefault();
    }
  },{passive:false});
})();

window.console = new Proxy(console, {
  get(target, prop) {
    if (['log', 'warn', 'error'].includes(prop)) {
      return new Proxy(target[prop], {
        apply(fn, thisArg, args) {
          fn.apply(thisArg, args);
          window.parent.postMessage({ action: 'console', 
            type: prop, 
            args: args.map((arg) => {
              try {
                return JSON.stringify(arg).replace(/^["']|["']$/g, '');
              } catch (e) {
                return arg;
              }
            }) 
          }, '*');
        }
      });
    }
    return target[prop];
  }
});
